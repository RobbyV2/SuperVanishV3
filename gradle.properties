org.gradle.configuration-cache=true
org.gradle.parallel=true
org.gradle.caching=true

# org.gradle.java.home is deliberately not set here. It used to pin one
# contributor's Windows JDK path, which made the build fail for everyone else.
# Both modules declare a Java 21 toolchain instead, so Gradle resolves (and if
# necessary provisions) the right JDK on whatever machine is building.
